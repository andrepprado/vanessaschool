<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#F7F3EA">

    <title>
        Lição | English in Your Time
    </title>

    
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/book.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/speech.css">

    <link rel="stylesheet" href="css/lesson-feedback.css">
</head>

<body class="lesson-page">

    <header class="lesson-topbar">

        <button class="lesson-close" id="closeLesson" type="button" aria-label="Fechar">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>

        <div class="lesson-top-progress">

            <div class="progress">

                <div class="progress-bar" id="lessonProgressBar"></div>

            </div>

        </div>

        <div class="lesson-xp">
            +
            <span id="lessonXp">
                0
            </span>
            XP
        </div>

    </header>

    <main id="lessonContent" class="lesson-content"></main>

    <footer id="lessonFooter" class="lesson-answer-footer hidden">

        <div class="lesson-footer-inner">

            <div id="lessonFeedback" class="lesson-feedback"></div>

            <button id="lessonAction" class="btn btn-primary" type="button">
                Verificar
            </button>

        </div>

    </footer>

    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <script src="js/speech.js?v=20260930-natural-1"></script>

    <script src="js/lesson-sounds.js"></script>

    <script src="js/licao.js"></script>

</body>

</html>
